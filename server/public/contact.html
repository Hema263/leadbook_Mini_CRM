<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Contact us</title>
<style>
  body{font-family:system-ui,sans-serif;background:#f7f6f2;display:grid;place-items:center;min-height:100vh;margin:0}
  form{background:#fff;padding:28px;border-radius:10px;width:min(420px,92vw);border:1px solid #dedbd2}
  h1{margin:0 0 16px;font-size:22px} label{display:block;font-size:14px;margin-top:12px}
  input,textarea{width:100%;padding:9px;margin-top:4px;border:1px solid #bbb;border-radius:6px;font:inherit;box-sizing:border-box}
  button{margin-top:18px;width:100%;padding:11px;background:#1f5c4d;color:#fff;border:0;border-radius:6px;font:inherit;cursor:pointer}
  #msg{margin-top:12px;font-size:14px}
</style></head><body>
<form id="f">
  <h1>Tell us about your project</h1>
  <label>Name<input name="name" required></label>
  <label>Email<input name="email" type="email" required></label>
  <label>Phone (optional)<input name="phone"></label>
  <label>Message<textarea name="message" rows="4"></textarea></label>
  <button>Send message</button>
  <div id="msg" role="status"></div>
</form>
<script>
  // On a real site, change this URL to your deployed API address.
  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const msg = document.getElementById('msg');
    const body = Object.fromEntries(new FormData(e.target));
    const r = await fetch('/api/leads/public', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    const d = await r.json();
    msg.textContent = r.ok ? 'Thanks! We will get back to you soon.' : d.error;
    if (r.ok) e.target.reset();
  });
</script></body></html>
